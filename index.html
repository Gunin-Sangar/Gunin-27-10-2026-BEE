<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iron &amp; Fuel | Gym Shop</title>

  <!-- font for headings. If it fails to load, the page uses Impact instead -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- top bar -->
  <header>
    <h1>Iron &amp; Fuel</h1>
    <b id="cartCount">Cart (0)</b>
  </header>

  <!-- big banner -->
  <section class="hero">
    <h2>Train hard.<br>Fuel right.</h2>
    <p>Gear, nutrition and apparel for your next session.</p>
  </section>

  <!-- search, filter and sort -->
  <div class="topBar">
    <input id="searchBox" type="search" placeholder="Search products">

    <select id="categoryBox">
      <option value="all">All categories</option>
    </select>

    <select id="sortBox">
      <option value="none">Sort: Default</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
      <option value="name">Name: A to Z</option>
    </select>
  </div>

  <div class="main">

    <!-- left side: products -->
    <section id="productList" class="productList"></section>

    <!-- right side: cart -->
    <aside class="box">
      <h2>Your cart</h2>
      <div id="cartList"></div>

      <div class="couponRow">
        <input id="couponBox" placeholder="Coupon code">
        <button id="couponBtn">Apply</button>
      </div>
      <p id="message"></p>

      <div class="row"><span>Subtotal</span><span id="subtotal"></span></div>
      <div class="row"><span>Discount</span><span id="discount"></span></div>
      <div class="row bigRow"><span>Total</span><span id="total"></span></div>

      <button id="checkoutBtn" class="mainBtn">Checkout</button>

      <!-- hidden until Checkout is clicked -->
      <form id="checkoutForm">
        <input id="nameBox" placeholder="Full name" required>
        <input id="addressBox" placeholder="Delivery address" required>
        <button type="submit" class="mainBtn">Place order</button>
      </form>
    </aside>

  </div>

  <script src="script.js"></script>
</body>
</html>
